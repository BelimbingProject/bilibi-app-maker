name: Release setup
on:
  workflow_dispatch:
  push:
    tags: ['setup-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guard:
    name: Tag is on the default branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a version tag on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            echo 'Validate this branch without publishing a release.'
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^setup-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tags must be setup-vX.Y.Z.' >&2
            exit 1
          }
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "Release tag $RELEASE_TAG does not point to a commit on $DEFAULT_BRANCH." >&2
            exit 1
          }
  # The tag contains the complete build record. Never choose newer source commits here.
  build:
    needs: guard
    uses: ./.github/workflows/check.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && 'setup-v0.0.0-test' || github.ref_name }}
    secrets:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
      SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
  sign:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    environment: release-signing
    outputs:
      operator_proof: ${{ steps.operator-proof.outputs.operator_proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: setup-release
          path: dist
      - name: Add operator release proofs when configured
        id: operator-proof
        env:
          BILIBI_RELEASE_SIGNING_KEY: ${{ secrets.BILIBI_RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$BILIBI_RELEASE_SIGNING_KEY" ]]; then
            echo 'No operator signing key is configured; GitHub attestation must prove this release.'
            exit 0
          fi
          tools=$(env -u BILIBI_RELEASE_SIGNING_KEY ./bilibi tooling)
          export BILIBI_TOOL_APPLICATION_ROOT="$PWD"
          export BILIBI_SOURCE_DIR="$RUNNER_TEMP/release-sources"
          (
            unset BILIBI_RELEASE_SIGNING_KEY
            mkdir -p "$BILIBI_SOURCE_DIR/platform"
            tar -xzf dist/bilibi-server-tools.tar.gz -C "$BILIBI_SOURCE_DIR/platform" scripts/lib/release-proof.py
          )
          python3 "$tools/scripts/sign_release.py" \
            --directory dist \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          echo 'operator_proof=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.operator-proof.outputs.operator_proof == 'true'
        with:
          name: setup-release-signed
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  attest:
    name: Attest every release asset
    needs: [build, sign]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
          (needs.sign.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      available: ${{ steps.provenance.outcome == 'success' }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.sign.outputs.operator_proof == 'true' && 'setup-release-signed' || 'setup-release' }}
          path: dist
      - name: Create GitHub build provenance
        id: provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
  draft:
    if: github.event_name == 'push'
    name: Publish the verified draft
    needs: [sign, attest]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.6.0'
      - name: Install the recorded maker tooling and its GitHub helpers
        run: |
          tools=$(./bilibi tooling)
          echo "BILIBI_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "BILIBI_TOOL_APPLICATION_ROOT=$PWD" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          cp -R "$tools/scripts/github-tools" "$RUNNER_TEMP/github-tools"
          npm ci --prefix "$RUNNER_TEMP/github-tools" --no-audit --no-fund --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.sign.outputs.operator_proof == 'true' && 'setup-release-signed' || 'setup-release' }}
          path: dist
      - name: Require an available release proof
        env:
          GITHUB_ATTESTATION_AVAILABLE: ${{ needs.attest.outputs.available }}
          OPERATOR_PROOF_AVAILABLE: ${{ needs.sign.outputs.operator_proof }}
        run: |
          if [[ "$GITHUB_ATTESTATION_AVAILABLE" != true && "$OPERATOR_PROOF_AVAILABLE" != true ]]; then
            echo 'Release setup needs either GitHub build provenance or BILIBI_RELEASE_SIGNING_KEY.' >&2
            exit 1
          fi
      - name: Create draft and verify every GitHub asset digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export PATH="$RUNNER_TEMP/github-tools/node_modules/.bin:$PATH"
          python3 "$BILIBI_TOOLS/scripts/publish.py" draft --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      # Publishing is an owner action: publish.py publish verifies the repository
      # immutability setting, which requires Administration:read. The build and
      # draft jobs deliberately have no administration credential.
